# Robotiq Hand-E C10 datasheet. See robotiq_2f_85.yaml for what each field means.
# Values from the Hand-E product sheet (June 2026). The C10's three fingers
# close concentrically: opening is the diameter between the fingertips.

model: robotiq_hand_e_c10

stroke:
  max_opening_mm: 40.0
  min_opening_mm: 0.0
  # One position-register count is stroke/247 = 0.16 mm of diameter on this
  # model. Closing with nothing between the fingers, a C10 settled at gPO 249
  # to 250, up to 0.16 mm short, which 0.5 mm covers.
  closed_tolerance_mm: 0.5

# The 14-107 mm/s range is the rate the diameter changes; a full close at
# rSP 255 took 0.39 s on a bench C10.
speed:
  min_mm_s: 14.0
  max_mm_s: 107.0

defaults:
  # 25-175 N per finger on the product sheet; effort is a register fraction,
  # as on the 2F-85.
  effort: 0.2
  motion_timeout_s: 10.0
